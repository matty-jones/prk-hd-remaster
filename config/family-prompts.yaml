version: v1
# Positive instructions only. Qwen-Image-2.1-Turbo samples at CFG 1, so a
# negative prompt is not part of the recipe.
shared: |
  Re-author the supplied original Anarchy Online texture as a premium modern-game albedo map.
  Keep the identifiable palette, large feature placement, and material identity.
  Invent convincing fine surface microstructure appropriate to the material.
  Orthographic, straight-on, unlit, uniform exposure, diffuse albedo appearance.
  No simulated directional lighting, no baked cast shadows, no photographic camera perspective.
  No lettering, no added objects, no borders, no watermarks, no frame.
  Output one albedo texture of the supplied surface, with no separate scene.
categories:
  terrain: |
    This is a repeating ground or terrain surface ({name}, family {family}).
    Keep the rock, soil, or vegetation type and the original arrangement.
    Add mineral grain, weathering, granular scale variation, and fine surface detail.
    The texture is a seamless periodic tile: opposite edges must continue the same surface.
  stone: |
    This is a repeating stone surface ({name}, family {family}).
    Keep the rock type, fracture placement, and palette.
    Add mineral grain, pitting, and fine crystalline detail.
    The texture is a seamless periodic tile: opposite edges must continue the same stone.
  architecture: |
    This is a repeating architectural surface ({name}, family {family}).
    Keep panel boundaries, coursing, and the original colour blocks in place.
    Add believable material grain, wear, and fine surface variation.
    The texture is a seamless periodic tile and must keep UV registration.
  metal: |
    This is a repeating metal or painted-metal surface ({name}, family {family}).
    Faithfully retain the original panel pattern, colour blocks, boundaries, and markings.
    Add micro-scratches, paint or metal grain, and physically plausible wear.
    Straight-on diffuse albedo, without baked reflections or dramatic highlights.
    The texture is a seamless periodic tile and must maintain UV registration.
  interior: |
    This is a repeating interior floor or trim ({name}, family {family}).
    Keep the original pattern, joints, and palette.
    Add fine material grain and subtle wear that stays consistent across the tile.
    The texture is a seamless periodic tile: opposite edges must continue the same surface.
default_category: |
  This is a repeating game-material surface ({name}, family {family}).
  Keep the original palette and feature placement.
  Add fine physically plausible surface detail.
  The texture is a seamless periodic tile.
v2:
  shared: |
    Re-author the supplied original Anarchy Online texture as a premium modern-game albedo.
    Orthographic, straight-on, unlit, uniform exposure, diffuse albedo.
    Keep one repeating surface with the same layout and UV registration.
    Seamless tile: opposite edges continue the same surface.
  certain: |
    The surface is {subject} ({name}, family {family}).
    Its appearance is {appearance}.
    Keep {hold}.
    Add {enhance}.
    Even diffuse colour across the tile, with the supplied image as the layout reference.
  uncertain: |
    Follow the supplied image. The subject is the surface already visible there ({name}, family {family}).
    Its appearance is {appearance}.
    Keep {hold}.
    Add fine grain of that same visible material.
    Even diffuse colour across the tile, with the supplied image as the layout reference.
v3:
  shared: |
    Reconstruct the supplied game texture as a sharp high-resolution albedo.
    The supplied image is a soft layout reference. Its fine pixels are compression, not material.
    Keep the large shapes, their positions, the repeat, and the broad colour regions.
    Orthographic, straight-on, unlit, uniform exposure, diffuse albedo.
    One seamless surface. Opposite edges continue the same material.
    No text, no extra objects, no border, no frame.
  certain: |
    The material is {subject} ({name}, family {family}).
    Broad appearance to keep: {appearance}.
    Hold in place: {hold}.
  uncertain: |
    Follow the surface already visible ({name}, family {family}).
    Broad appearance to keep: {appearance}.
    Hold in place: {hold}.
    Do not invent a new object or move the layout.
  expressive: |
    Invent sharp intermediate and fine surface detail that the low-resolution source could not store.
    Fill the surface with this new detail: {enhance}.
    That detail is sharper than the reference and does not copy the reference blur.
  restrained: |
    Keep tile boundaries, joints, broad colour regions, and large cracks in place.
    Rebuild worn surface variation at the scale of those shapes: slab faces, stains, and coursing.
    Treat the reference's blocky speckle as compression, not pores, chips, or grit.
    Keep the albedo's fine grain quiet and even. Do not sharpen the reference's pixel blocks.
v3_detail:
  cable: tight braided sheath and separate twisted strands running along every existing cable lane
  wire: separate twisted strands along each existing wire
  chain: individual links and edge wear on the existing chain
  rope: twisted fibres inside the existing rope
  dirt: sharp mineral grains, grit, and hard-edged soil crumbs, not a soft blur
  sand: distinct sand grains and small pebbles, not a soft blur
  grass: finer blades in the existing clumps, in the same green
  vegetation: finer blades in the existing clumps, in the same green
  wall: the existing pits, stains, and panel edges, with finer grain inside those shapes
  stone: mineral grain and pits inside the existing fractures
  wood: sharp grain lines that follow the existing boards
  brick: clay grain and grit in the existing mortar lines
