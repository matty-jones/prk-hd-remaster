version: v1
# Tokens are matched after the filename is split. Generic tokens do not invent a subject.
generic:
  - default
  - std
  - tex
  - texture
  - misc
  - unnamed
  - new
  - test
  - tmp
  - image
  - img
noise:
  - small
  - large
  - low
  - high
  - med
  - mid
  - tiny
  - big
  - tileable
  - tiled
  - png
  - jpg
  - jpeg
  - dds
  - bmp
  - tga
colors:
  blue: blue
  cyan: cyan
  purple: purple
  red: red
  green: green
  yellow: yellow
  orange: orange
  brown: brown
  white: white
  black: black
  grey: grey
  gray: grey
  dark: dark
  light: light
  neutral: neutral
  desat: desaturated
settings:
  dock: an industrial dock fitting
  athens: dressed masonry
  clan: a clan interior
subjects:
  cable:
    class: cable
    material: metal
    kind: manufactured
    rank: 90
    subject: bundled metal cables
    enhance: fine sheath braid, individual strands, and light scuffs inside each existing lane
    hold: the same cable lanes, their spacing, and their metal colour
  wire:
    class: wire
    material: metal
    kind: manufactured
    rank: 85
    subject: metal wire
    enhance: fine strands and light scuffs along the existing wires
    hold: the same wire paths and metal colour
  chain:
    class: chain
    material: metal
    kind: manufactured
    rank: 85
    subject: metal chain
    enhance: individual links and light wear on the existing chain
    hold: the same link rhythm and metal colour
  pipe:
    class: pipe
    material: metal
    kind: manufactured
    rank: 80
    subject: metal pipes
    enhance: seam lines, fittings, and light wear on the existing pipes
    hold: the same pipe runs and their colour
  rope:
    class: rope
    material: terrain
    kind: manufactured
    rank: 80
    subject: rope
    enhance: twisted fibres inside the existing rope
    hold: the same rope paths and colour
  stripe:
