[project]
name = "prk-remaster"
version = "0.1.0"
description = "Local HD texture remaster factory for Project Rubi-Ka ao-vk packs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "huggingface_hub>=0.26",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "pillow>=10.4",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[project.scripts]
prk-remaster = "prk_remaster.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prk_remaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
